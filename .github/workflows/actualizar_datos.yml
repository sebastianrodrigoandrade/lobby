name: Actualizar datos Lobby

on:
  schedule:
    # Corre todos los lunes a las 6 AM UTC (3 AM Argentina)
    - cron: '0 6 * * 1'
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  actualizar:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Instalar dependencias
      run: |
        pip install pandas sqlalchemy psycopg2-binary python-dotenv requests
    
    - name: Actualizar votaciones HCDN
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        python scripts/ingesta/actualizar_todo.py
    
    - name: Actualizar comisiones y fotos
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        python scripts/ingesta/actualizar_comisiones.py
    
    - name: Mostrar estado final
      env:
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASS: ${{ secrets.DB_PASS }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_NAME: ${{ secrets.DB_NAME }}
      run: |
        python -c "
from sqlalchemy import text, create_engine
import os
DB_USER = os.getenv('DB_USER')
DB_PASS = os.getenv('DB_PASS')
DB_HOST = os.getenv('DB_HOST')
DB_NAME = os.getenv('DB_NAME')
DATABASE_URL = f'postgresql://{DB_USER}:{DB_PASS}@{DB_HOST}/{DB_NAME}?sslmode=require'
engine = create_engine(DATABASE_URL)
with engine.connect() as conn:
    print('=== ESTADO FINAL ===')
    r = conn.execute(text('SELECT COUNT(*) FROM votaciones_hcdn'))
    print(f'Votaciones HCDN: {r.scalar()}')
    r = conn.execute(text('SELECT COUNT(*) FROM votos_hcdn'))
    print(f'Votos HCDN: {r.scalar()}')
    r = conn.execute(text('SELECT COUNT(*) FROM comision_integrantes'))
    print(f'Integrantes comisiones: {r.scalar()}')
    r = conn.execute(text('SELECT COUNT(*) FROM legisladores WHERE foto_url IS NOT NULL'))
    print(f'Legisladores con foto: {r.scalar()}')
engine.dispose()
"
